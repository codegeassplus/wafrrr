<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشغل البث-- المباشر</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #18233a 0%, #080b12 45%, #050608 100%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .55),
                0 0 0 1px rgba(255, 255, 255, .08);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, .72);
            z-index: 5;

            transition: opacity .3s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;

            border-radius: 50%;
            animation: spin .8s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 15px;
            padding: 12px 15px;

            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .08);

            border-radius: 12px;
            text-align: center;

            color: #cbd5e1;
            font-size: 14px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            margin-top: 14px;

            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .player-box {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📺 -  ---البث المباشر</h1>
        <p>مشغل HLS سريع ومتوافق مع مختلف الشاشات</p>
    </div>

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            preload="auto">
        </video>

        <div class="loading" id="loading">
            <div class="spinner" id="spinner"></div>
            <div id="loadingText">جاري الاتصال بالبث...</div>
        </div>

    </div>

    <div class="status" id="status">
        جاري تجهيز المشغل...
    </div>

    <div class="footer">
        HLS Live Player
    </div>

</div>


<script>

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const status = document.getElementById("status");
    const spinner = document.getElementById("spinner");

    /*
     * رابط الـ Worker
     */
    const streamUrl =
        "https://still-dust-c9ae.manon-lol2000.workers.dev/assets/res2/java2/1340.css?x=/hls/";

    let hls = null;
    let retryTimer = null;
    let destroyed = false;


    function showLoading(text = "جاري الاتصال بالبث...") {

        loadingText.innerHTML = text;

        spinner.style.display = "block";

        loading.classList.remove("hidden");
    }


    function hideLoading() {

        loading.classList.add("hidden");
    }


    function showError(message) {

        loading.classList.remove("hidden");

        spinner.style.display = "none";

        loadingText.innerHTML = "⚠️ " + message;

        status.innerHTML = message;

        status.classList.add("error");
    }


    function clearError() {

        status.classList.remove("error");
    }


    function destroyHls() {

        if (hls) {

            try {
                hls.destroy();
            } catch (e) {
                console.log(e);
            }

            hls = null;
        }
    }


    function retryPlayer() {

        if (destroyed) {
            return;
        }

        clearTimeout(retryTimer);

        retryTimer = setTimeout(() => {

            console.log("إعادة محاولة تشغيل البث...");

            destroyHls();

            startPlayer();

        }, 3000);
    }


    function startPlayer() {

        if (destroyed) {
            return;
        }

        clearError();

        showLoading("جاري الاتصال بالبث...");

        /*
         * ==========================
         * HLS.js
         * ==========================
         */

        if (Hls.isSupported()) {

            destroyHls();

            hls = new Hls({

                enableWorker: true,

                /*
                 * إعدادات مناسبة للبث المباشر
                 */
                liveSyncDurationCount: 3,

                liveMaxLatencyDurationCount: 6,

                maxBufferLength: 30,

                maxMaxBufferLength: 60,

                backBufferLength: 30,

                lowLatencyMode: false,

                /*
                 * إعادة المحاولة عند أخطاء الشبكة
                 */
                manifestLoadingMaxRetry: 5,

                manifestLoadingRetryDelay: 1000,

                levelLoadingMaxRetry: 5,

                levelLoadingRetryDelay: 1000,

                fragLoadingMaxRetry: 5,

                fragLoadingRetryDelay: 1000

            });


            /*
             * تحميل رابط البث
             */
            hls.loadSource(streamUrl);


            /*
             * ربط HLS بالفيديو
             */
            hls.attachMedia(video);


            /*
             * تم تحميل الـ Manifest
             */
            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    console.log("HLS Manifest Loaded");

                    status.innerHTML =
                        "🟢 تم الاتصال بالبث";

                    clearError();

                    hideLoading();

                    /*
                     * محاولة التشغيل التلقائي
                     */
                    video.play().catch(() => {

                        status.innerHTML =
                            "🟢 البث جاهز - اضغط زر التشغيل";

                    });

                }
            );


            /*
             * بدأ تشغيل الفيديو
             */
            hls.on(
                Hls.Events.FRAG_LOADED,
                function () {

                    /*
                     * لا نخفي شاشة التحميل إلا
                     * بعد وصول أول جزء من البث
                     */
                }
            );


            /*
             * معالجة أخطاء HLS
             */
            hls.on(
                Hls.Events.ERROR,
                function (event, data) {

                    console.log("HLS Error:", data);

                    if (!data.fatal) {
                        return;
                    }


                    /*
                     * خطأ في الشبكة
                     */
                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        showError(
                            "تعذر الاتصال بالبث، جاري إعادة المحاولة..."
                        );

                        /*
                         * محاولة إعادة تحميل الشبكة
                         */
                        try {

                            hls.startLoad();

                        } catch (e) {

                            retryPlayer();

                        }

                        return;
                    }


                    /*
                     * خطأ في الفيديو
                     */
                    if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        status.classList.remove("error");

                        status.innerHTML =
                            "🔄 محاولة إصلاح تشغيل الفيديو...";

                        try {

                            hls.recoverMediaError();

                        } catch (e) {

                            retryPlayer();

                        }

                        return;
                    }


                    /*
                     * خطأ غير معروف
                     */
                    showError(
                        "تعذر تشغيل البث، جاري إعادة المحاولة..."
                    );

                    retryPlayer();

                }
            );


            /*
             * أخطاء تحميل الـ Manifest
             */
            hls.on(
                Hls.Events.MANIFEST_LOADING,
                function () {

                    console.log(
                        "جاري تحميل HLS Manifest..."
                    );

                }
            );


            /*
             * نجاح تحميل الـ Manifest
             */
            hls.on(
                Hls.Events.MANIFEST_LOADED,
                function () {

                    console.log(
                        "تم تحميل Manifest بنجاح"
                    );

                }
            );

        }


        /*
         * ==========================
         * Safari / Native HLS
         * ==========================
         */

        else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            console.log(
                "استخدام Native HLS"
            );

            video.src = streamUrl;


            video.addEventListener(
                "loadedmetadata",
                function () {

                    status.innerHTML =
                        "🟢 تم الاتصال بالبث";

                    clearError();

                    hideLoading();

                    video.play().catch(() => {

                        status.innerHTML =
                            "🟢 البث جاهز - اضغط زر التشغيل";

                    });

                },
                { once: true }
            );


            video.addEventListener(
                "error",
                function () {

                    showError(
                        "تعذر تشغيل رابط البث"
                    );

                    retryPlayer();

                },
                { once: true }
            );

        }


        /*
         * المتصفح لا يدعم HLS
         */
        else {

            showError(
                "المتصفح لا يدعم تشغيل HLS"
            );

        }

    }


    /*
     * عند بدء التشغيل فعلياً
     */
    video.addEventListener(
        "playing",
        function () {

            hideLoading();

            clearError();

            status.innerHTML =
                "🟢 البث يعمل الآن";

        }
    );


    /*
     * عند توقف الفيديو مؤقتاً بسبب Buffer
     */
    video.addEventListener(
        "waiting",
        function () {

            showLoading(
                "جاري تحميل البث..."
            );

        }
    );


    /*
     * عند استئناف التشغيل
     */
    video.addEventListener(
        "canplay",
        function () {

            if (!video.paused) {
                hideLoading();
            }

        }
    );


    /*
     * في حالة حدوث خطأ بالفيديو
     */
    video.addEventListener(
        "error",
        function () {

            if (
                video.error &&
                video.error.code
            ) {

                console.log(
                    "Video Error:",
                    video.error
                );

            }

        }
    );


    /*
     * بدء المشغل
     */
    startPlayer();


    /*
     * تنظيف المشغل عند مغادرة الصفحة
     */
    window.addEventListener(
        "beforeunload",
        function () {

            destroyed = true;

            clearTimeout(retryTimer);

            destroyHls();

        }
    );

</script>

</body>
</html>
