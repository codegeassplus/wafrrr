<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشغل البث المباشر</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #18233a 0%, #080b12 45%, #050608 100%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0,0,0,.55),
                0 0 0 1px rgba(255,255,255,.08);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,.72);
            z-index: 5;

            transition: opacity .3s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid rgba(255,255,255,.2);
            border-top-color: #fff;

            border-radius: 50%;

            animation: spin .8s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 15px;
            padding: 12px 15px;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);

            border-radius: 12px;

            text-align: center;

            color: #cbd5e1;
            font-size: 14px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            margin-top: 14px;

            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .player-box {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📺 البث المباشر</h1>
        <p>مشغل HLS سريع ومتوافق مع مختلف الشاشات</p>
    </div>

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            preload="auto">
        </video>

        <div class="loading" id="loading">

            <div class="spinner" id="spinner"></div>

            <div id="loadingText">
                جاري الاتصال بالبث...
            </div>

        </div>

    </div>

    <div class="status" id="status">
        جاري تجهيز المشغل...
    </div>

    <div class="footer">
        HLS Live Player
    </div>

</div>


<script>

const video =
    document.getElementById("video");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const status =
    document.getElementById("status");

const spinner =
    document.getElementById("spinner");


/*
 * قراءة channel من الرابط
 *
 * مثال:
 *
 * s.html?channel=1340
 */
const params =
    new URLSearchParams(
        window.location.search
    );

const channel =
    params.get("channel");


/*
 * تحديد رابط البث
 */
let streamUrl = "";


/*
 * القناة 1340
 */
if (channel === "1340") {

    streamUrl =
        "https://still-dust-c9ae.manon-lol2000.workers.dev/assets/res2/java2/1340.css?x=/hls/";

}


/*
 * في حالة عدم وجود قناة
 */
if (!streamUrl) {

    spinner.style.display = "none";

    loadingText.innerHTML =
        "⚠️ رابط البث غير موجود";

    status.innerHTML =
        "لم يتم تحديد رابط البث";

    status.classList.add("error");

}


/*
 * HLS
 */
let hls = null;

let retryTimer = null;

let retryCount = 0;


/*
 * إظهار التحميل
 */
function showLoading(text) {

    loadingText.innerHTML = text;

    spinner.style.display = "block";

    loading.classList.remove("hidden");

}


/*
 * إخفاء التحميل
 */
function hideLoading() {

    loading.classList.add("hidden");

}


/*
 * خطأ
 */
function showError(message) {

    spinner.style.display = "none";

    loadingText.innerHTML =
        "⚠️ " + message;

    status.innerHTML =
        message;

    status.classList.add("error");

    loading.classList.remove("hidden");

}


/*
 * تشغيل HLS
 */
function startPlayer() {

    if (!streamUrl) {
        return;
    }

    showLoading(
        "جاري الاتصال بالبث..."
    );


    /*
     * HLS.js
     */
    if (Hls.isSupported()) {

        if (hls) {

            hls.destroy();

            hls = null;

        }


        hls = new Hls({

            enableWorker: true,

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 6,

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            backBufferLength: 30,

            lowLatencyMode: false,

            manifestLoadingMaxRetry: 3,

            manifestLoadingRetryDelay: 1000,

            levelLoadingMaxRetry: 3,

            levelLoadingRetryDelay: 1000,

            fragLoadingMaxRetry: 3,

            fragLoadingRetryDelay: 1000

        });


        /*
         * تحميل الرابط
         */
        hls.loadSource(streamUrl);


        /*
         * ربط الفيديو
         */
        hls.attachMedia(video);


        /*
         * Manifest جاهز
         */
        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                retryCount = 0;

                status.innerHTML =
                    "🟢 تم الاتصال بالبث";

                status.classList.remove(
                    "error"
                );

                hideLoading();


                video.play().catch(
                    function () {

                        status.innerHTML =
                            "🟢 البث جاهز - اضغط تشغيل";

                    }
                );

            }
        );


        /*
         * أخطاء HLS
         */
        hls.on(
            Hls.Events.ERROR,
            function (
                event,
                data
            ) {

                console.log(
                    "HLS ERROR:",
                    data
                );


                if (!data.fatal) {
                    return;
                }


                /*
                 * خطأ شبكة
                 */
                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    retryCount++;


                    if (retryCount <= 3) {

                        status.innerHTML =
                            "⚠️ تعذر الاتصال بالبث، جاري إعادة المحاولة...";


                        setTimeout(
                            function () {

                                if (hls) {

                                    hls.startLoad();

                                }

                            },
                            2000
                        );

                    } else {

                        showError(
                            "تعذر الاتصال برابط البث"
                        );

                    }

                    return;
                }


                /*
                 * خطأ فيديو
                 */
                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    status.innerHTML =
                        "🔄 محاولة إصلاح الفيديو...";

                    hls.recoverMediaError();

                    return;
                }


                showError(
                    "تعذر تشغيل البث"
                );

            }
        );

    }


    /*
     * Native HLS
     */
    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = streamUrl;

        video.addEventListener(
            "loadedmetadata",
            function () {

                status.innerHTML =
                    "🟢 تم الاتصال بالبث";

                hideLoading();

                video.play().catch(
                    function () {}
                );

            },
            {
                once: true
            }
        );

    }


    /*
     * غير مدعوم
     */
    else {

        showError(
            "المتصفح لا يدعم HLS"
        );

    }
}


/*
 * تشغيل فعلي
 */
video.addEventListener(
    "playing",
    function () {

        hideLoading();

        status.classList.remove(
            "error"
        );

        status.innerHTML =
            "🟢 البث يعمل الآن";

    }
);


/*
 * انتظار Buffer
 */
video.addEventListener(
    "waiting",
    function () {

        showLoading(
            "جاري تحميل البث..."
        );

    }
);


/*
 * بدء التشغيل
 */
startPlayer();


/*
 * تنظيف
 */
window.addEventListener(
    "beforeunload",
    function () {

        if (hls) {

            hls.destroy();

            hls = null;

        }

    }
);

</script>

</body>

</html>
