<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مشغل البث المباشر</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #18233a 0%, #080b12 45%, #050608 100%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0,0,0,.55),
                0 0 0 1px rgba(255,255,255,.08);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,.72);
            z-index: 5;

            transition: opacity .3s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid rgba(255,255,255,.2);
            border-top-color: #fff;

            border-radius: 50%;
            animation: spin .8s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 15px;
            padding: 12px 15px;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);

            border-radius: 12px;
            text-align: center;

            color: #cbd5e1;
            font-size: 14px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            margin-top: 14px;

            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .player-box {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📺 البث المباشر</h1>
        <p>مشغل HLS سريع ومتوافق مع مختلف الشاشات</p>
    </div>

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            preload="auto">
        </video>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div id="loadingText">جاري الاتصال بالبث...</div>
        </div>

    </div>

    <div class="status" id="status">
        جاري تجهيز المشغل...
    </div>

    <div class="footer">
        HLS Live Player
    </div>

</div>


<script>

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const status = document.getElementById("status");

    /*
     * رابط البث الذي أرسلته
     */
    const streamUrl =
        "https://still-dust-c9ae.manon-lol2000.workers.dev/assets/res2/java2/1340.css?x=/hls/";

    let hls = null;


    function hideLoading() {
        loading.classList.add("hidden");
    }


    function showError(message) {

        loading.classList.remove("hidden");

        loadingText.innerHTML = "⚠️ " + message;

        document.querySelector(".spinner").style.display = "none";

        status.innerHTML = message;
        status.classList.add("error");
    }


    function startPlayer() {

        /*
         * HLS.js
         */
        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true,

                liveSyncDurationCount: 3,

                maxBufferLength: 30,

                maxMaxBufferLength: 60
            });

            hls.loadSource(streamUrl);

            hls.attachMedia(video);


            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                status.innerHTML = "🟢 تم الاتصال بالبث";

                hideLoading();

                video.play().catch(() => {
                    /*
                     * بعض المتصفحات تمنع التشغيل التلقائي.
                     * سيظهر زر التشغيل من مشغل الفيديو.
                     */
                });
            });


            hls.on(Hls.Events.ERROR, function (event, data) {

                console.log("HLS Error:", data);

                if (data.fatal) {

                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                        showError("تعذر الاتصال برابط البث");

                        /*
                         * محاولة إعادة الاتصال
                         */
                        setTimeout(() => {

                            if (hls) {
                                hls.startLoad();
                            }

                        }, 2000);

                    }

                    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                        status.innerHTML =
                            "محاولة إصلاح مشكلة تشغيل الفيديو...";

                        hls.recoverMediaError();

                    }

                    else {

                        showError("تعذر تشغيل البث");

                        hls.destroy();
                    }
                }
            });

        }

        /*
         * HLS الأصلي
         * مثل Safari
         */
        else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src = streamUrl;

            video.addEventListener(
                "loadedmetadata",
                function () {

                    status.innerHTML =
                        "🟢 تم الاتصال بالبث";

                    hideLoading();

                    video.play().catch(() => {});
                }
            );

        }

        else {

            showError(
                "المتصفح لا يدعم تشغيل HLS"
            );
        }
    }


    /*
     * عند بدء الفيديو
     */
    video.addEventListener("playing", function () {

        hideLoading();

        status.innerHTML =
            "🟢 البث يعمل الآن";
    });


    /*
     * عند الانتظار بسبب البفر
     */
    video.addEventListener("waiting", function () {

        loadingText.innerHTML =
            "جاري تحميل البث...";

        loading.classList.remove("hidden");
    });


    /*
     * عند العودة للتشغيل
     */
    video.addEventListener("playing", function () {

        hideLoading();
    });


    /*
     * تشغيل المشغل
     */
    startPlayer();

</script>

</body>
</html>
