<script>

let channels = [];
let streams = [];


/* =========================
   الإعدادات
========================= */

function value(id){
    return document.getElementById(id).value.trim();
}

function panelApi(){
    return value("panelApi").replace(/\/+$/,"");
}

function networkKey(){
    return value("networkKey");
}

function oscarApi(){
    return value("oscarApi").replace(/\/+$/,"");
}

function oscarKey(){
    return value("oscarKey");
}

function status(text){
    document.getElementById("status").textContent = text;
}


/* =========================
   استدعاء Oscar API
========================= */

async function apiCall(endpoint, params={}){

    let url =
        oscarApi() +
        "/" +
        endpoint.replace(/^\/+/,"");

    const u = new URL(url);

    for(const [key,val] of Object.entries(params)){

        if(
            val !== undefined &&
            val !== null &&
            String(val) !== ""
        ){
            u.searchParams.set(key,String(val));
        }

    }

    const key = oscarKey();

    if(key){
        u.searchParams.set("key",key);
    }

    const response =
        await fetch(
            u.href,
            {
                cache:"no-store"
            }
        );

    const text =
        await response.text();

    let data;

    try{
        data = JSON.parse(text);
    }catch{
        throw new Error(
            "الـ API أعاد استجابة غير JSON"
        );
    }

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return data;
}


/* =========================
   فك استجابة Oscar
========================= */

function unwrap(data){

    let d = data;

    for(let i=0;i<6;i++){

        if(
            !d ||
            typeof d !== "object" ||
            Array.isArray(d)
        ){
            break;
        }

        if(
            d.upstream &&
            typeof d.upstream === "object"
        ){
            d = d.upstream;
            continue;
        }

        if(
            d.response &&
            typeof d.response === "object"
        ){
            d = d.response;
            continue;
        }

        if(
            d.result &&
            typeof d.result === "object"
        ){
            d = d.result;
            continue;
        }

        if(
            d.data &&
            typeof d.data === "object"
        ){
            d = d.data;
            continue;
        }

        break;
    }

    return d;
}


function listOf(data){

    const root = unwrap(data);

    if(Array.isArray(root)){
        return root;
    }

    if(!root || typeof root !== "object"){
        return [];
    }

    for(
        const key of [
            "items",
            "results",
            "list",
            "data",
            "channels",
            "collections"
        ]
    ){

        if(Array.isArray(root[key])){
            return root[key];
        }

    }

    for(
        const value of Object.values(root)
    ){

        if(
            Array.isArray(value) &&
            value.some(
                x =>
                x &&
                typeof x === "object"
            )
        ){
            return value;
        }

    }

    return [];
}


function detailOf(data){

    const d = unwrap(data);

    if(Array.isArray(d)){
        return d[0] || {};
    }

    return d &&
           typeof d === "object"
        ? d
        : {};
}


/* =========================
   بيانات القناة
========================= */

function channelId(c){

    return (
        c.id ||
        c.channel_id ||
        c.item_id ||
        ""
    );

}


function channelTitle(c){

    return (
        c.name_ar ||
        c.title_ar ||
        c.channel_name ||
        c.name ||
        c.title ||
        c.name_en ||
        "قناة"
    );

}


/* =========================
   استخراج روابط البث
========================= */

function extractUrl(s){

    if(typeof s === "string"){

        return /^https?:\/\//i.test(s)
            ? s
            : "";

    }

    if(!s || typeof s !== "object"){
        return "";
    }

    return (
        s.stream_url ||
        s.url ||
        s.link ||
        s.file ||
        s.src ||
        s.video ||
        s.hls ||
        s.m3u8 ||
        s.deep_link ||
        s.watch_url ||
        ""
    );

}


function extractStreams(raw){

    const output = [];

    const seen = new Set();


    function add(
        value,
        parent={},
        index=0
    ){

        if(!value){
            return;
        }

        if(
            typeof value === "string"
        ){

            const url =
                extractUrl(value);

            if(url && !seen.has(url)){

                seen.add(url);

                output.push({

                    url:url,

                    quality:
                        parent.quality ||
                        parent.resolution ||
                        "LIVE",

                    name:
                        parent.name ||
                        parent.server ||
                        `سيرفر ${index+1}`,

                    type:
                        parent.type ||
                        "رابط مباشر"

                });

            }

            return;
        }


        if(Array.isArray(value)){

            value.forEach(
                (x,i) =>
                    add(x,parent,i)
            );

            return;
        }


        if(
            typeof value === "object"
        ){

            const direct =
                extractUrl(value);

            if(direct){

                const quality =
                    value.quality ||
                    value.resolution ||
                    parent.quality ||
                    "LIVE";

                const name =
                    value.name ||
                    value.server ||
                    value.label ||
                    parent.name ||
                    `سيرفر ${index+1}`;

                if(!seen.has(direct)){

                    seen.add(direct);

                    output.push({

                        url:direct,

                        quality:String(
                            quality
                        ).replace(/p$/i,""),

                        name:name,

                        type:
                            value.type ||
                            parent.type ||
                            "رابط مباشر"

                    });

                }

            }


            const nestedKeys = [

                "links",
                "items",
                "sources",
                "qualities",
                "servers",
                "videos",
                "streams",
                "watch_links",
                "watchLinks"

            ];


            for(
                const key of nestedKeys
            ){

                if(value[key]){

                    add(
                        value[key],
                        {
                            ...value,
                            name:
                                value.name ||
                                value.server ||
                                value.label
                        },
                        index
                    );

                }

            }

        }

    }


    /*
     * نفس أنواع الحقول التي
     * تتعامل معها الصفحة الأصلية.
     */

    const keys = [

        "stream_links",
        "streamLinks",
        "streams",
        "watch_links",
        "watchLinks",
        "watch",
        "videos",
        "servers",
        "links",
        "qualities",
        "sources",
        "stream"

    ];


    for(
        const key of keys
    ){

        if(raw[key]){
            add(
                raw[key],
                raw
            );
        }

    }


    /*
     * إذا كانت نتيجة API نفسها
     * تحتوي على رابط مباشر.
     */

    add(raw,raw);


    return output;

}


/* =========================
   جلب القنوات
========================= */

async function loadChannels(){

    try{

        channels = [];
        streams = [];

        resetCounters();

        status(
            "جاري جلب القنوات..."
        );


        /*
         * نفس طلب الصفحة الأصلية
         */

        const [
            collectionsResponse,
            listResponse
        ] = await Promise.all([

            apiCall(
                "channels.collections"
            ),

            apiCall(
                "channels.list",
                {
                    page:1,
                    limit:120
                }
            )

        ]);


        const collections =
            listOf(
                collectionsResponse
            );

        const listed =
            listOf(
                listResponse
            );


        /*
         * دمج القنوات بدون تكرار
         */

        const map = new Map();


        function addChannel(c){

            if(
                !c ||
                typeof c !== "object"
            ){
                return;
            }

            const id =
                channelId(c);

            const key =
                id ||
                channelTitle(c);

            if(!map.has(key)){
                map.set(key,c);
            }

        }


        collections.forEach(
            group => {

                const items =
                    Array.isArray(
                        group.channels
                    )
                    ? group.channels
                    : (
                        Array.isArray(
                            group.items
                        )
                        ? group.items
                        : []
                    );

                items.forEach(addChannel);

            }
        );


        listed.forEach(addChannel);


        channels =
            Array.from(
                map.values()
            );


        document.getElementById(
            "total"
        ).textContent =
            channels.length;


        renderRows();


        status(
            "تم جلب " +
            channels.length +
            " قناة. جاري استخراج روابط البث..."
        );


        /*
         * جلب تفاصيل كل قناة
         * للحصول على السيرفرات
         */

        for(
            let i=0;
            i<channels.length;
            i++
        ){

            await loadChannelStreams(
                channels[i],
                i
            );

        }


        document.getElementById(
            "links"
        ).textContent =
            streams.length;


        renderRows();


        status(
            "✅ تم استخراج " +
            streams.length +
            " رابط بث"
        );


    }catch(error){

        console.error(error);

        status(
            "❌ " +
            error.message
        );

    }

}


/* =========================
   تفاصيل قناة
========================= */

async function loadChannelStreams(
    channel,
    channelIndex
){

    const id =
        channelId(channel);

    if(!id){
        return;
    }


    try{

        const response =
            await apiCall(
                "channels.show",
                {
                    id:id
                }
            );


        const raw =
            detailOf(response);


        const channelStreams =
            extractStreams(raw);


        channelStreams.forEach(
            stream => {

                streams.push({

                    channel:
                        channelTitle(channel),

                    channelIndex:
                        channelIndex,

                    quality:
                        stream.quality,

                    name:
                        stream.name,

                    type:
                        stream.type,

                    url:
                        stream.url

                });

            }
        );


        updateRow(
            channelIndex,
            channelStreams
        );


    }catch(error){

        updateChannelError(
            channelIndex,
            error.message
        );

    }

}


/* =========================
   إنشاء الصفوف
========================= */

function renderRows(){

    const tbody =
        document.getElementById(
            "results"
        );

    tbody.innerHTML = "";


    if(!channels.length){

        tbody.innerHTML = `
        <tr>
        <td colspan="8">
        لا توجد قنوات
        </td>
        </tr>
        `;

        return;
    }


    channels.forEach(
        (channel,index) => {

            const row =
                document.createElement(
                    "tr"
                );

            row.id =
                "channel-" +
                index;


            row.innerHTML = `

<td>
${index + 1}
</td>

<td>
<b>
${escapeHtml(
    channelTitle(channel)
)}
</b>
</td>

<td class="quality">
-
</td>

<td class="server">
-
</td>

<td class="url">
-
</td>

<td class="state wait">
⏳ بانتظار الفحص
</td>

<td class="time">
-
</td>

<td>
<button
class="secondary"
onclick="checkChannel(${index})">
فحص
</button>
</td>

`;

            tbody.appendChild(row);

        }
    );

}


/* =========================
   تحديث صف القناة
========================= */

function updateRow(
    channelIndex,
    channelStreams
){

    const row =
        document.getElementById(
            "channel-" +
            channelIndex
        );

    if(!row){
        return;
    }


    if(!channelStreams.length){

        row.querySelector(
            ".state"
        ).className =
            "state bad";

        row.querySelector(
            ".state"
        ).textContent =
            "🔴 لا يوجد رابط";


        row.querySelector(
            ".quality"
        ).textContent =
            "-";


        row.querySelector(
            ".server"
        ).textContent =
            "-";


        return;
    }


    /*
     * نعرض أول رابط
     * في صف القناة.
     */

    const s =
        channelStreams[0];


    row.querySelector(
        ".quality"
    ).textContent =
        s.quality || "LIVE";


    row.querySelector(
        ".server"
    ).textContent =
        s.name || "-";


    row.querySelector(
        ".url"
    ).textContent =
        s.url;


    row.querySelector(
        ".state"
    ).textContent =
        "جاهز للفحص";


    /*
     * زر الفحص يصبح فحصاً
     * لجميع روابط القناة.
     */

    row.querySelector(
        "button"
    ).onclick =
        () => checkChannel(
            channelIndex
        );

}


/* =========================
   فحص قناة
========================= */

async function checkChannel(
    channelIndex
){

    const channel =
        channels[channelIndex];

    const channelStreams =
        streams.filter(
            s =>
                s.channelIndex ===
                channelIndex
        );


    if(!channelStreams.length){

        await loadChannelStreams(
            channel,
            channelIndex
        );

    }


    const list =
        streams.filter(
            s =>
                s.channelIndex ===
                channelIndex
        );


    if(!list.length){

        updateChannelError(
            channelIndex,
            "لا توجد روابط"
        );

        return;

    }


    /*
     * نفحص جميع الجودات
     * ونستخدم أول رابط يعمل.
     */

    const row =
        document.getElementById(
            "channel-" +
            channelIndex
        );

    const stateEl =
        row.querySelector(
            ".state"
        );

    const timeEl =
        row.querySelector(
            ".time"
        );


    stateEl.className =
        "state wait";

    stateEl.textContent =
        "⏳ فحص البث...";


    for(
        const stream of list
    ){

        const result =
            await testHLS(
                stream.url
            );


        if(result.ok){

            stateEl.className =
                "state good";

            stateEl.textContent =
                "🟢 يعمل";


            row.querySelector(
                ".quality"
            ).textContent =
                stream.quality ||
                "LIVE";


            row.querySelector(
                ".server"
            ).textContent =
                stream.name ||
                "-";


            row.querySelector(
                ".url"
            ).textContent =
                stream.url;


            timeEl.textContent =
                result.time +
                " ms";


            increment(
                "working"
            );


            return;

        }

    }


    stateEl.className =
        "state bad";

    stateEl.textContent =
        "🔴 متوقف";


    timeEl.textContent =
        "فشل التشغيل";


    increment(
        "stopped"
    );

}


/* =========================
   فحص HLS فعلي
========================= */

function testHLS(url){

    return new Promise(
        resolve => {

            const started =
                performance.now();


            const video =
                document.createElement(
                    "video"
                );


            video.muted = true;

            video.playsInline = true;

            video.setAttribute(
                "playsinline",
                ""
            );

            video.style.display =
                "none";


            document.body.appendChild(
                video
            );


            let finished = false;

            let hls = null;


            function done(ok){

                if(finished){
                    return;
                }

                finished = true;


                const time =
                    Math.round(
                        performance.now() -
                        started
                    );


                if(hls){

                    try{
                        hls.destroy();
                    }catch{}

                }


                video.pause();

                video.removeAttribute(
                    "src"
                );

                video.load();


                setTimeout(
                    () => video.remove(),
                    50
                );


                resolve({
                    ok:ok,
                    time:time
                });

            }


            const timer =
                setTimeout(
                    () => done(false),
                    10000
                );


            if(
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ){

                video.src = url;


                video.addEventListener(
                    "loadedmetadata",
                    () => {

                        clearTimeout(
                            timer
                        );

                        video.play()
                            .then(
                                () => done(true)
                            )
                            .catch(
                                () => done(true)
                            );

                    },
                    {
                        once:true
                    }
                );


                video.addEventListener(
                    "error",
                    () => {

                        clearTimeout(
                            timer
                        );

                        done(false);

                    },
                    {
                        once:true
                    }
                );


                return;
            }


            if(
                window.Hls &&
                Hls.isSupported()
            ){

                hls =
                    new Hls({

                        enableWorker:true,

                        lowLatencyMode:true,

                        manifestLoadingMaxRetry:1,

                        levelLoadingMaxRetry:1

                    });


                hls.loadSource(
                    url
                );


                hls.attachMedia(
                    video
                );


                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => {

                        clearTimeout(
                            timer
                        );

                        /*
                         * وصول الـmanifest بنجاح
                         * يعني أن رابط HLS يستجيب.
                         */

                        done(true);

                    }
                );


                hls.on(
                    Hls.Events.ERROR,
                    (event,data) => {

                        if(
                            data.fatal
                        ){

                            clearTimeout(
                                timer
                            );

                            done(false);

                        }

                    }
                );


                return;
            }


            clearTimeout(
                timer
            );

            done(false);

        }
    );

}


/* =========================
   فحص جميع القنوات
========================= */

async function checkAll(){

    if(!channels.length){

        status(
            "جلب القنوات أولاً"
        );

        return;
    }


    document.getElementById(
        "working"
    ).textContent = "0";

    document.getElementById(
        "stopped"
    ).textContent = "0";


    for(
        let i=0;
        i<channels.length;
        i++
    ){

        status(
            "فحص القناة " +
            (i+1) +
            " من " +
            channels.length
        );


        await checkChannel(i);

    }


    status(
        "✅ انتهى فحص جميع القنوات"
    );

}


/* =========================
   جلب وفحص
========================= */

async function loadAndCheck(){

    await loadChannels();

    if(channels.length){

        await checkAll();

    }

}


/* =========================
   أدوات
========================= */

function updateChannelError(
    index,
    message
){

    const row =
        document.getElementById(
            "channel-" +
            index
        );

    if(!row){
        return;
    }


    const stateEl =
        row.querySelector(
            ".state"
        );


    stateEl.className =
        "state bad";

    stateEl.textContent =
        "🔴 " + message;


    increment(
        "stopped"
    );

}


function increment(id){

    const el =
        document.getElementById(id);

    el.textContent =
        Number(
            el.textContent
        ) + 1;

}


function resetCounters(){

    document.getElementById(
        "total"
    ).textContent = "0";

    document.getElementById(
        "links"
    ).textContent = "0";

    document.getElementById(
        "working"
    ).textContent = "0";

    document.getElementById(
        "stopped"
    ).textContent = "0";

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
